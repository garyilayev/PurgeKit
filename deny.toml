# cargo-deny configuration. Run: cargo deny check
#
# The ban list enforces "0.1 contains no networking code": any HTTP, socket or
# async-network crate in the dependency graph fails CI. The import check
# (`cargo run -p xtask -- check-imports`) verifies the same on the binaries.

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu", "aarch64-pc-windows-msvc"]
all-features = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # HTTP clients and servers
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "h2" },
    { name = "ureq" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "surf" },
    { name = "minreq" },
    { name = "http-req" },
    { name = "winhttp" },
    # Sockets and async networking runtimes
    { name = "socket2" },
    { name = "mio" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    { name = "async-net" },
    { name = "tungstenite" },
    { name = "websocket" },
    { name = "trust-dns-resolver" },
    { name = "hickory-resolver" },
    # TLS stacks only make sense with networking
    { name = "rustls" },
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "CDLA-Permissive-2.0",
    # Slint is tri-licensed (GPL-3.0-only OR royalty-free OR commercial); GPL is
    # deliberately not allowed, so Slint passes through its royalty-free option.
    # Open question in the spec: confirm the royalty-free license fits a free app.
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
