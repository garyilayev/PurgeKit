[workspace]
resolver = "3"
members = [
    "crates/purgekit-core",
    "crates/purgekit-rules",
    "crates/purgekit-engine",
    "crates/purgekit-win",
    "apps/purgekit",
    "apps/purgekit-helper",
    "xtask",
]
# cargo-fuzz crate: nightly-only, has its own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
purgekit-core = { path = "crates/purgekit-core" }
purgekit-rules = { path = "crates/purgekit-rules" }
purgekit-engine = { path = "crates/purgekit-engine" }
purgekit-win = { path = "crates/purgekit-win" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
rayon = "1.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
proptest = "1.11"
criterion = "0.8"
slint = "1.18"
slint-build = "1.18"
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
windows-sys = "0.61"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
