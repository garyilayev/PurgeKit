name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes Windows integration tests on real NTFS (junctions, hard
      # links, open files, swapped roots) and the helper adversarial test.
      - name: Test
        run: cargo test --workspace

  no-network:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Dependency bans (no HTTP/socket crates), licenses, advisories
        run: cargo deny check
      - name: Release build
        run: cargo build --release -p purgekit -p purgekit-helper
      - name: Neither binary imports a networking DLL
        run: cargo run -p xtask -- check-imports release

  # Matcher fuzzing (spec "Testing and quality"). purgekit-rules runs on any
  # OS, so libFuzzer runs on Linux with nightly; each target gets a bounded
  # time. Invariant: a rule never authorizes a path outside its root.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz rel_path (normalization + every built-in rule)
        working-directory: fuzz
        run: cargo fuzz run rel_path -- -max_total_time=90 -dict=${{ github.workspace }}/fuzz/matcher.dict -timeout=10
      - name: Fuzz glob (pattern parser + DP matcher)
        working-directory: fuzz
        run: cargo fuzz run glob -- -max_total_time=90 -dict=${{ github.workspace }}/fuzz/matcher.dict -timeout=10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Regression gate: medians are compared with a baseline from the latest
  # main run (restored from the Actions cache). A benchmark fails when it is
  # more than 10% slower AND its 95% CI does not overlap the baseline's; the
  # toggle benchmarks must also stay under 16 ms. With no baseline (first run,
  # cache evicted) the job passes and main saves one. Details: xtask/src/bench.rs.
  bench:
    runs-on: windows-latest
    env:
      PURGEKIT_BENCH_FILES: "200000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Restore main baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline
          # The exact key never exists yet; restore-keys picks the newest main baseline.
          key: bench-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: bench-baseline-${{ runner.os }}-
      - name: Benchmarks
        run: cargo bench -p purgekit-engine -p purgekit-win
      - name: Compare with baseline (fails on > 10% regression)
        run: cargo run -p xtask -- bench-check --baseline bench-baseline/baseline.json --save bench-baseline/baseline.json --threshold 10
      - name: Save baseline (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion
          path: target/criterion
