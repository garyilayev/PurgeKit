[rule]
id = "windows.user_temp"
display_name = "Temporary files"
category = "windows"
template = "temp-files"
root = "{Temp}"
detect = "root_exists"
min_age = "24h"
target = "files"
tier = "safe"
elevation = "none"
what = "Files that apps put in your temporary folder while they work."
why_safe = "Apps use these files only while they run. PurgeKit removes only files that nothing has changed for at least 24 hours."
after_effects = "Nothing you will notice. Apps make new temporary files when they need them."
