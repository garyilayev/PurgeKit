[rule]
id = "windows.system_temp"
display_name = "Windows temporary files"
category = "windows"
template = "temp-files"
root = "{Windows}/Temp"
detect = "root_exists"
min_age = "24h"
target = "files"
tier = "advanced"
elevation = "required"
what = "Temporary files that Windows and installers put in the Windows Temp folder."
why_safe = "Windows uses these files only during installs and updates. PurgeKit removes only files that nothing has changed for at least 24 hours."
after_effects = "Nothing you will notice. Windows asks for administrator permission once to remove them."
