[rule]
id = "discord.cache"
display_name = "Discord cache"
category = "apps"
template = "chromium-cache"
profile = "."
root = "{RoamingAppData}/discord"
detect = "root_exists"
process_deps = ["discord.exe"]
target = "files"
tier = "safe"
elevation = "none"
what = "Temporary web files that Discord saved for its built-in browser view."
why_safe = "Discord downloads or rebuilds these files automatically when needed. Your messages, settings and sign-in are in different folders."
after_effects = "Discord may start or load content a little slower the first time."
